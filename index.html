<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farmer's Milk — Coming Soon · Wien 🇦🇹</title>
<meta name="description" content="Farm-fresh Bakery Café. Eröffnet bald in Wien — hinterlasse deine E-Mail und erfahre das Eröffnungsdatum zuerst.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vollkorn+SC:wght@400;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#EEE7DA; --matcha:#A2CA8A; --matcha-light:#DCE8CE; --matcha-deep:#66855A;
    --coral:#FFA489; --coral-deep:#E07B5E; --ink:#252220;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Montserrat',sans-serif;background:var(--matcha-light);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
  .langs{position:absolute;top:14px;right:16px;display:flex;gap:6px;z-index:10}
  .langs button{font-family:'Montserrat',sans-serif;font-weight:600;font-size:12px;padding:7px 11px;border:none;border-radius:20px;background:rgba(255,255,255,.55);color:var(--matcha-deep);cursor:pointer;transition:all .2s}
  .langs button.active,.langs button:hover{background:var(--matcha-deep);color:#fff}
  .hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 22px 40px;text-align:center}
  .logo{height:clamp(64px,10vw,96px);margin-bottom:26px;filter:drop-shadow(0 6px 18px rgba(224,123,94,.30))}
  .kicker{font-weight:700;font-size:13px;letter-spacing:.22em;color:var(--coral-deep);text-transform:uppercase;margin-bottom:12px}
  h1{font-family:'Vollkorn SC',serif;font-weight:600;font-size:clamp(30px,7vw,56px);line-height:1.12;margin:0 auto 10px;max-width:16ch;text-wrap:balance}
  .tagline{font-size:clamp(16px,2.4vw,21px);color:var(--matcha-deep);font-weight:600;letter-spacing:.04em;margin-bottom:26px}
  .invite-card{background:var(--cream);border-radius:22px;padding:30px 26px;max-width:450px;width:100%;box-shadow:0 14px 40px rgba(37,34,32,.14);border-top:6px solid var(--coral)}
  .invite-card h2{font-family:'Vollkorn SC',serif;font-size:20px;margin-bottom:10px;text-wrap:balance}
  .invite-card p{font-size:14.5px;color:rgba(37,34,32,.72);margin-bottom:20px;line-height:1.55}
  form{display:flex;flex-direction:column;gap:12px}
  input[type=email]{font-family:'Montserrat',sans-serif;font-size:16px;padding:15px 18px;border:2px solid rgba(37,34,32,.10);border-radius:12px;outline:none;transition:border-color .2s;background:#fff}
  input[type=email]:focus{border-color:var(--coral)}
  .submit{font-family:'Vollkorn SC',serif;font-size:18px;letter-spacing:.03em;padding:15px 18px;border:none;border-radius:12px;background:var(--coral);color:var(--ink);cursor:pointer;transition:background .2s,transform .1s}
  .submit:hover{background:var(--coral-deep);color:#fff}
  .submit:active{transform:scale(.98)}
  .submit:disabled{opacity:.6;cursor:wait}
  .form-note{font-size:12px;color:rgba(37,34,32,.5);margin-top:12px}
  .success{display:none;padding:18px;background:var(--matcha);border-radius:12px;font-weight:600;color:var(--ink);line-height:1.45}
  .cakes{display:flex;align-items:flex-end;justify-content:center;gap:clamp(14px,4vw,44px);margin-top:40px}
  .cakes img{height:clamp(90px,16vw,150px);width:auto;filter:drop-shadow(0 16px 16px rgba(37,34,32,.20));transition:transform .3s}
  .cakes img:hover{transform:translateY(-6px)}
  .ig{margin-top:32px;font-size:15px}
  .ig a{color:var(--coral-deep);font-weight:700;text-decoration:none;border-bottom:2px solid var(--coral)}
  footer{padding:20px;text-align:center;font-size:13px;color:rgba(37,34,32,.6)}
  footer .motto{font-family:'Vollkorn SC',serif;font-size:14px;letter-spacing:.05em;margin-bottom:4px}
</style>
</head>
<body>
  <div class="langs" id="langs"></div>

  <main class="hero">
    <img class="logo" src="assets/logo-coral.png" alt="Farmer's Milk">
    <div class="kicker" data-i18n="kicker"></div>
    <h1 data-i18n="h1"></h1>
    <div class="tagline">Farm-fresh Bakery Café · <span data-i18n="tag"></span></div>

    <div class="invite-card">
      <h2 data-i18n="card_h"></h2>
      <p data-i18n="card_p"></p>
      <form id="invite-form">
        <input type="email" name="email" data-i18n-ph="ph" required autocomplete="email">
        <button type="submit" class="submit" id="submit-btn" data-i18n="btn"></button>
      </form>
      <div class="success" id="success"></div>
      <div class="form-note" data-i18n="note"></div>
    </div>

    <div class="cakes">
      <img src="assets/cake_feather.png" alt="Kuchen">
      <img src="assets/cake_honey.png" alt="Medovik">
      <img src="assets/cake_crown.png" alt="Kuchen">
    </div>

    <div class="ig"><span data-i18n="follow"></span> <a href="https://www.instagram.com/farmersmilk.austria/" target="_blank" rel="noopener">@farmersmilk.austria</a></div>
  </main>
  <footer>
    <div class="motto">Different farms. One Farmer's Milk.</div>
    <div data-i18n="roots"></div>
  </footer>

<script>
const I18N = {
  de: {
    kicker:'Coming Soon', h1:'Eröffnet bald in Wien 🇦🇹', tag:'Kuchen · Frühstück · Kaffee',
    card_h:'Wir laden dich zur Eröffnung ein',
    card_p:'Hinterlasse deine E-Mail — wir schicken dir das Eröffnungsdatum und deine persönliche Einladung.',
    ph:'deine@email.at', btn:'Einladung sichern',
    success:'✅ Danke! Wir schreiben dir, sobald das Eröffnungsdatum feststeht. 🤍',
    note:'Kein Spam — nur die Einladung. Versprochen.',
    follow:'Folge uns:', roots:'Ukrainische Wurzeln · Farm-frisch vom ersten Tag an',
    sending:'Wird gesendet…', error:'Etwas hat nicht geklappt — bitte noch einmal versuchen.'
  },
  en: {
    kicker:'Coming Soon', h1:'Opening soon in Vienna 🇦🇹', tag:'Cakes · Breakfast · Coffee',
    card_h:'You’re invited to our opening',
    card_p:'Leave your email — we’ll send you the opening date and your personal invitation.',
    ph:'you@email.com', btn:'Get my invitation',
    success:'✅ Thank you! We’ll email you as soon as the opening date is set. 🤍',
    note:'No spam — just the invitation. Promise.',
    follow:'Follow us:', roots:'Ukrainian roots · Farm-fresh since day one',
    sending:'Sending…', error:'Something went wrong — please try again.'
  },
  ua: {
    kicker:'Скоро відкриття', h1:'Незабаром відкриваємося у Відні 🇦🇹', tag:'Торти · Сніданки · Кава',
    card_h:'Запрошуємо тебе на відкриття',
    card_p:'Залиш свій e-mail — ми повідомимо дату відкриття й надішлемо особисте запрошення.',
    ph:'tviy@email.com', btn:'Отримати запрошення',
    success:'✅ Дякуємо! Напишемо, щойно дата відкриття буде відома. 🤍',
    note:'Без спаму — лише запрошення. Обіцяємо.',
    follow:'Стеж за нами:', roots:'Українське коріння · Фермерська свіжість з першого дня',
    sending:'Надсилаємо…', error:'Щось пішло не так — спробуй ще раз.'
  },
  cz: {
    kicker:'Coming Soon', h1:'Brzy otevíráme ve Vídni 🇦🇹', tag:'Dorty · Snídaně · Káva',
    card_h:'Zveme tě na otevření',
    card_p:'Zanech svůj e-mail — pošleme ti datum otevření a osobní pozvánku.',
    ph:'tvuj@email.cz', btn:'Chci pozvánku',
    success:'✅ Děkujeme! Jakmile bude datum otevření jasné, napíšeme ti. 🤍',
    note:'Žádný spam — jen pozvánka. Slibujeme.',
    follow:'Sleduj nás:', roots:'Ukrajinské kořeny · Čerstvé z farmy od prvního dne',
    sending:'Odesíláme…', error:'Něco se nepovedlo — zkus to prosím znovu.'
  }
};

const LANGS = ['de','en','ua','cz'];
function getLang(){
  const q = new URLSearchParams(location.search).get('lang');
  if (q && LANGS.includes(q)) return q;
  const saved = localStorage.getItem('fm_lang');
  if (saved && LANGS.includes(saved)) return saved;
  return 'de';
}
function apply(lang){
  const t = I18N[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t[el.dataset.i18n] || '');
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t[el.dataset.i18nPh] || '');
  document.querySelectorAll('#langs button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  localStorage.setItem('fm_lang', lang);
}
const langsBox = document.getElementById('langs');
LANGS.forEach(l => {
  const b = document.createElement('button');
  b.textContent = l.toUpperCase(); b.dataset.lang = l;
  b.onclick = () => apply(l);
  langsBox.appendChild(b);
});
apply(getLang());

const form = document.getElementById('invite-form');
const btn = document.getElementById('submit-btn');
const successBox = document.getElementById('success');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const t = I18N[getLang()];
  btn.disabled = true; btn.textContent = t.sending;
  try {
    const res = await fetch('https://formsubmit.co/ajax/farmersmilksmm+austria@gmail.com', {
      method: 'POST',
      headers: {'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify({
        email: form.email.value,
        _subject: "🐄 Farmer's Milk Wien — neue Einladung",
        lang: getLang(),
        source: 'farmersmilk.at landing'
      })
    });
    if (!res.ok) throw new Error('send failed');
    form.style.display = 'none';
    successBox.textContent = t.success;
    successBox.style.display = 'block';
  } catch (err) {
    btn.disabled = false; btn.textContent = t.btn;
    alert(t.error);
  }
});
</script>
</body>
</html>
